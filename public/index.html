<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8dfe7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>48 ore · La caccia</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://tile.openstreetmap.org" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="ambient ambient-three"></div>
  <div class="page-doodle doodle-one" aria-hidden="true">✦</div>
  <div class="page-doodle doodle-two" aria-hidden="true">♡</div>
  <div class="page-doodle doodle-three" aria-hidden="true">☻</div>

  <main class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="La caccia">
        <span class="brand-mark">✦</span>
        <span>la tua caccia · 48 ore</span>
      </div>
      <div id="timer" class="timer-pill" aria-live="polite"></div>
    </header>

    <section id="app" class="stage" aria-live="polite">
      <div class="loading-card">
        <span class="spinner"></span>
        <p>Sto nascondendo le ultime cose…</p>
      </div>
    </section>
  </main>

  <button id="chatButton" class="chat-fab hidden" aria-label="Apri la chat" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5A3.5 3.5 0 0 1 8 2h8a3.5 3.5 0 0 1 3.5 3.5v7A3.5 3.5 0 0 1 16 16H9.4L5 20v-4.7a3.5 3.5 0 0 1-.5-1.8z"/></svg>
    <span id="chatUnread" class="chat-unread hidden"></span>
  </button>

  <div id="chatBackdrop" class="chat-backdrop hidden"></div>
  <aside id="chatPanel" class="chat-panel" aria-hidden="true">
    <header class="chat-header">
      <div>
        <span class="chat-kicker">noi due, mentre giochi</span>
        <h2>Messaggi</h2>
      </div>
      <button id="chatClose" class="icon-button" aria-label="Chiudi chat">×</button>
    </header>
    <div id="chatMessages" class="chat-messages"></div>
    <form id="chatForm" class="chat-compose">
      <textarea id="chatInput" rows="1" maxlength="500" placeholder="Scrivimi…" aria-label="Messaggio"></textarea>
      <button class="send-button" aria-label="Invia messaggio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 20 18-8L3 4v6l13 2-13 2z"/></svg>
      </button>
    </form>
  </aside>

  <div id="toast" class="toast hidden" role="status"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
